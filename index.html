<style>
/* Переливающийся текст */
@keyframes lysShimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
}

.hero h1 em,
.section-title,
.logo-name,
.footer-brand {
    background-image: linear-gradient(
        110deg,
        #b57946 0%,
        #f0c59a 25%,
        #fff4df 45%,
        #d6a06b 65%,
        #b57946 100%
    );
    background-size: 200% auto;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: lysShimmer 6s linear infinite;
}

/* Мягкое свечение карточек */
.content-card,
.price-card,
.benefit {
    position: relative;
    isolation: isolate;
}

.content-card::before,
.price-card::before,
.benefit::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: inherit;
    background: radial-gradient(
        320px circle at var(--mx, 50%) var(--my, 50%),
        rgba(240, 197, 154, .16),
        transparent 75%
    );
    opacity: 0;
    transition: opacity .35s;
    pointer-events: none;
}

.content-card:hover::before,
.price-card:hover::before,
.benefit:hover::before {
    opacity: 1;
}

.content-card:hover .card-number {
    color: #17100b;
    background: var(--gold-light);
    box-shadow: 0 0 24px #d6a06b40;
}

.card-number {
    transition: color .3s, background .3s, box-shadow .3s;
}

/* Живые кнопки */
.btn {
    transition:
        transform .25s,
        box-shadow .25s,
        filter .25s;
}

.btn:hover {
    box-shadow:
        0 10px 35px #d6a06b40,
        0 0 25px #d6a06b20;
}

.lys-photo-link {
    display: inline-block;
    margin-top: 12px;
    color: var(--gold-light);
    font-size: 11px;
    font-weight: 700;
}

/* Окно с фотографиями */
.lys-gallery {
    position: fixed;
    inset: 0;
    margin: auto;
    width: min(900px, calc(100% - 28px));
    max-height: 90dvh;
    padding: 32px;
    overflow-y: auto;
    color: var(--text);
    background: linear-gradient(145deg, #211a14, #111);
    border: 1px solid var(--gold);
    border-radius: 24px;
    box-shadow: 0 30px 100px #0009;
}

.lys-gallery[open] {
    animation: lysGalleryEnter .3s ease both;
}

.lys-gallery::backdrop {
    background: #000c;
    backdrop-filter: blur(10px);
}

@keyframes lysGalleryEnter {
    from { opacity: 0; transform: translateY(18px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.lys-gallery-close {
    position: absolute;
    top: 10px;
    right: 16px;
    width: 44px;
    height: 44px;
    border: 0;
    background: transparent;
    color: var(--gold-light);
    font-size: 32px;
}

.lys-gallery-title {
    padding-right: 40px;
    color: var(--gold-light);
    font-size: clamp(20px, 4vw, 28px);
}

.lys-gallery-description {
    margin: 12px 0 24px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.8;
}

.lys-gallery-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
}

.lys-gallery figure {
    min-width: 0;
    padding: 18px;
    background: #ffffff04;
    border: 1px solid var(--border);
    border-radius: 16px;
}

.lys-gallery figcaption {
    margin-bottom: 15px;
    color: var(--gold-light);
    font-size: 12px;
    text-align: center;
}

.lys-photo-frame {
    height: 350px;
    display: grid;
    place-items: center;
    overflow: hidden;
}

.lys-photo-frame img {
    display: block;
    width: 100%;
    height: 100%;
    min-height: 0;
    object-fit: contain;
    transition: transform .5s;
}

.lys-photo-frame:hover img {
    transform: scale(1.06);
}

.lys-photo-missing {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
}

/* Плавное появление карточек */
@keyframes lysCardEnter {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
}

.content-card.lys-visible {
    animation: lysCardEnter .6s ease both;
    animation-delay: var(--lys-delay, 0ms);
}

@media (max-width: 600px) {
    .lys-gallery { padding: 28px 18px; }
    .lys-gallery-grid { grid-template-columns: 1fr; }
    .lys-photo-frame { height: 280px; }
}

@media (prefers-reduced-motion: reduce) {
    .hero h1 em,
    .section-title,
    .logo-name,
    .footer-brand,
    .lys-gallery[open],
    .content-card.lys-visible {
        animation: none;
    }

    .lys-photo-frame img {
        transition: none;
    }
}
</style>

<script>
(() => {
    "use strict";

    /*
     * Создай папку images рядом с HTML.
     * Положи туда фото с указанными ниже именами
     * или замени пути на ссылки на свои фотографии.
     */
    const photos = [
        {
            front: "./images/innenraum-front.png",
            back: "./images/innenraum-back.png"
        },
        {
            front: "./images/glas-front.png",
            back: "./images/glas-back.png"
        },
        {
            front: "./images/felgen-front.png",
            back: "./images/felgen-back.png"
        },
        {
            front: "./images/microfibres-front.png",
            back: "./images/microfibres-back.png"
        },
        {
            front: "./images/brushes-case-front.png",
            back: "./images/brushes-case-back.png"
        },
        {
            front: "./images/guide-front.png",
            back: "./images/guide-back.png"
        },
        {
            front: "./images/surprise-front.png",
            back: "./images/surprise-back.png"
        }
    ];

    const copy = {
        de: {
            brushes: [
                "Detailing-Pinsel mit Etui",
                "Detailing-Pinsel für kleine Zwischenräume – inklusive praktischem Etui."
            ],
            surprise: [
                "Überraschung von LYS",
                "Eine besondere Überraschung von LYS in deiner Box."
            ],
            faq: "Drei Pflegeprodukte à 330 ml, drei Mikrofasertücher, Detailing-Pinsel mit Etui, eine Anleitung und eine Überraschung von LYS.",
            view: "Fotos ansehen ↗",
            front: "Vorderseite",
            back: "Rückseite",
            missing: "Foto noch nicht verfügbar.",
            close: "Schließen"
        },
        en: {
            brushes: [
                "Detailing brushes with case",
                "Detailing brushes for small spaces, including a practical storage case."
            ],
            surprise: [
                "A surprise from LYS",
                "A special surprise from LYS inside your box."
            ],
            faq: "Three 330 ml care products, three microfibre cloths, detailing brushes with a case, a guide and a surprise from LYS.",
            view: "View photos ↗",
            front: "Front",
            back: "Back",
            missing: "Photo not available yet.",
            close: "Close"
        },
        ru: {
            brushes: [
                "Кисточки с чехлом",
                "Детейлинг-кисточки для труднодоступных мест в комплекте с удобным чехлом."
            ],
            surprise: [
                "Сюрприз от LYS",
                "Особенный сюрприз от LYS внутри вашего бокса."
            ],
            faq: "Три средства по 330 мл, три микрофибры, кисточки с чехлом, инструкция и сюрприз от LYS.",
            view: "Смотреть фото ↗",
            front: "Спереди",
            back: "Сзади",
            missing: "Фото пока не добавлено.",
            close: "Закрыть"
        },
        ua: {
            brushes: [
                "Пензлі з чохлом",
                "Детейлінг-пензлі для важкодоступних місць у комплекті зі зручним чохлом."
            ],
            surprise: [
                "Сюрприз від LYS",
                "Особливий сюрприз від LYS усередині вашого боксу."
            ],
            faq: "Три засоби по 330 мл, три мікрофібри, пензлі з чохлом, інструкція та сюрприз від LYS.",
            view: "Переглянути фото ↗",
            front: "Спереду",
            back: "Ззаду",
            missing: "Фото поки не додано.",
            close: "Закрити"
        }
    };

    for (const [lang, text] of Object.entries(copy)) {
        translations[lang].contents[4] = text.brushes;
        translations[lang].contents[6] = text.surprise;
        translations[lang].faq[0][1] = text.faq;
    }

    const dialog = document.createElement("dialog");
    dialog.className = "lys-gallery";
    dialog.id = "lys-photo-dialog";
    dialog.setAttribute("aria-labelledby", "lys-photo-title");
    dialog.setAttribute("aria-describedby", "lys-photo-description");
    dialog.innerHTML = `
        <button class="lys-gallery-close" type="button">×</button>
        <h2 class="lys-gallery-title" id="lys-photo-title"></h2>
        <p class="lys-gallery-description" id="lys-photo-description"></p>
        <div class="lys-gallery-grid"></div>
    `;
    document.body.append(dialog);

    let returnFocus = null;
    let savedOverflow = "";

    const currentCopy = () => copy[language] || copy.de;

    function openPhotos(index) {
        const product = translations[language].contents[index];
        if (!product || !photos[index]) return;

        const text = currentCopy();
        const [title, description] = product;

        dialog.querySelector("h2").textContent =
            `${String(index + 1).padStart(2, "0")} · ${title}`;

        dialog.querySelector(".lys-gallery-description").textContent =
            description;

        const closeButton = dialog.querySelector("button");
        closeButton.setAttribute("aria-label", text.close);

        const grid = dialog.querySelector(".lys-gallery-grid");
        grid.replaceChildren();

        for (const side of ["front", "back"]) {
            const figure = document.createElement("figure");
            const caption = document.createElement("figcaption");
            const frame = document.createElement("div");
            const image = document.createElement("img");

            caption.textContent = text[side];
            frame.className = "lys-photo-frame";
            image.alt = `${title} — ${text[side]}`;

            image.addEventListener("error", () => {
                const message = document.createElement("p");
                message.className = "lys-photo-missing";
                message.textContent = text.missing;
                frame.replaceChildren(message);
            }, { once: true });

            /*
             * Если используется предыдущий исправленный HTML,
             * сохраняем уже встроенное фото очистителя дисков.
             */
            const existingPhoto =
                typeof productPhotos !== "undefined"
                    ? productPhotos[index]?.[side]
                    : null;

            image.src = existingPhoto?.startsWith("data:")
                ? existingPhoto
                : photos[index][side];

            frame.append(image);
            figure.append(caption, frame);
            grid.append(figure);
        }

        returnFocus = document.activeElement;
        savedOverflow = document.body.style.overflow;

        dialog.showModal();
        document.body.style.overflow = "hidden";
        closeButton.focus();
    }

    dialog.querySelector("button").addEventListener("click", () => {
        dialog.close();
    });

    /* Escape поддерживается самим dialog. */
    dialog.addEventListener("close", () => {
        document.body.style.overflow = savedOverflow;
        returnFocus?.focus();
    });

    dialog.addEventListener("click", event => {
        if (event.target !== dialog) return;

        const rect = dialog.getBoundingClientRect();
        const outside =
            event.clientX < rect.left ||
            event.clientX > rect.right ||
            event.clientY < rect.top ||
            event.clientY > rect.bottom;

        if (outside) dialog.close();
    });

    const grid = document.querySelector("#contents-grid");

    /*
     * Перехватываем нажатия до старого обработчика заказа.
     * Работает и после переключения языка.
     */
    grid.addEventListener("click", event => {
        const card = event.target.closest(".content-card");
        if (!card) return;

        event.preventDefault();
        event.stopPropagation();

        const cards = [...grid.querySelectorAll(".content-card")];
        openPhotos(cards.indexOf(card));
    }, true);

    const reduced = matchMedia(
        "(prefers-reduced-motion: reduce)"
    ).matches;

    const observer = !reduced && "IntersectionObserver" in window
        ? new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (!entry.isIntersecting) return;
                entry.target.classList.add("lys-visible");
                observer.unobserve(entry.target);
            });
        }, { threshold: .12 })
        : null;

    function decorateCards() {
        const text = currentCopy();

        grid.querySelectorAll(".content-card").forEach((card, index) => {
            card.removeAttribute("data-order");
            card.setAttribute("aria-haspopup", "dialog");
            card.setAttribute("aria-controls", dialog.id);
            card.style.setProperty(
                "--lys-delay",
                `${(index % 3) * 80}ms`
            );

            /* Убираем подпись из предыдущей версии, если она есть. */
            card.querySelector(".photo-link")?.remove();

            const body = card.querySelector("div");
            if (body && !body.querySelector(".lys-photo-link")) {
                const hint = document.createElement("span");
                hint.className = "lys-photo-link";
                hint.textContent = text.view;
                body.append(hint);
            }

            observer?.observe(card);
        });
    }

    new MutationObserver(decorateCards).observe(grid, {
        childList: true
    });

    renderContent();
    decorateCards();

    /* Свечение следует за курсором. */
    document.addEventListener("pointermove", event => {
        if (reduced || event.pointerType === "touch") return;

        const card = event.target.closest(
            ".content-card, .price-card, .benefit"
        );
        if (!card) return;

        const rect = card.getBoundingClientRect();
        card.style.setProperty("--mx", `${event.clientX - rect.left}px`);
        card.style.setProperty("--my", `${event.clientY - rect.top}px`);
    }, { passive: true });
})();
</script>
